# Non-API sources. Each is data, not code — add a site by adding a block.
#
# verified: true  = selectors were tested against the live page and matched
# verified: false = plausible target, NOT yet confirmed. Run verify_sources.py.
#
# A source returning 0 rows is reported loudly, because "no calls this week"
# and "the scraper broke" look identical otherwise.

sources:
  # ---------------------------------------------------------------- BiH
  - id: hbz-mpvs
    name: "Canton 10 — Ministry of Agriculture (HBŽ)"
    url: "https://mpvs-hbz.gov.ba/"
    link_selector: "h2 a"
    category: BiH
    call_type: national
    countries: [BiH]
    programme: "Hercegbosanska županija"
    verified: true
    note: "Cantonal ministry for Tomislavgrad's canton. Young-farmer and agrotourism calls appear here."

  - id: hbz-vlada
    name: "Canton 10 — Government public calls"
    url: "https://www.vladahbz.com/javni-natjecaji/"
    link_selector: "li a"
    title_min_len: 30
    category: BiH
    call_type: national
    countries: [BiH]
    programme: "Vlada Hercegbosanske županije"
    verified: true
    note: "All cantonal public calls. Heavy job-vacancy noise, filtered out."

  - id: fbih-mpvs
    name: "FBiH — Ministry of Agriculture"
    url: "https://fmpvs.gov.ba/"
    link_selector: "h2 a, h3 a, .entry-title a"
    category: BiH
    call_type: national
    countries: [BiH]
    programme: "Federacija BiH"
    verified: true
    note: "Federal agriculture support. Incentives page is attachment-driven; main listing used instead."

  - id: bih-eu-delegation
    name: "EU Delegation to BiH — calls"
    url: "https://europa.ba/?page_id=huge"
    link_selector: "h2 a, h3 a, .entry-title a"
    category: BiH
    call_type: national
    countries: [BiH]
    programme: "EU in BiH"
    verified: false
    note: "IPA and EU-funded calls for BiH. URL needs confirming."

  # ------------------------------------------------------------ Cascade
  # Cascade sub-calls are NOT in the EU portal API (verified), so a curated
  # aggregator is the only practical index.
  - id: cascade-kaila
    name: "Kaila — cascade funding roundup"
    url: "https://kaila.eu/blog/cascade-funding-101-open-calls/"
    parser: table
    category: IT
    call_type: cascade
    programme: "Cascade / FSTP"
    # Standard Horizon Europe FSTP ceiling per third party. Call conditions can
    # raise it, so this is a conservative floor, always shown as an estimate.
    assumed_grant_eur: 60000
    verified: true
    note: "Table of live FSTP open calls with multiple deadline rounds."

  - id: cascade-eudis
    name: "EUDIS cascade funding"
    url: "https://eudis.europa.eu/eudis-tracks/cascade-funding_en"
    link_selector: "a"
    category: IT
    call_type: cascade
    programme: "EUDIS cascade"
    verified: true
    note: "EU Defence Innovation Scheme cascade calls."

  # ----------------------------------------------------------- Interreg
  # All three Interreg programmes below need work. Their old URLs were dead;
  # these respond, but the pages render their call lists with JavaScript, so a
  # static fetch returns no anchors. Fixing them means either finding a JSON
  # endpoint or running Playwright in the workflow. Left enabled and honest:
  # verify_sources.py reports them as returning nothing.
  - id: interreg-ipa-cbc
    name: "Interreg IPA CBC Croatia–BiH–Montenegro"
    url: "https://interreg-hr-ba-me.eu/"
    link_selector: "h2 a, h3 a, .entry-title a, article a"
    category: Interreg
    call_type: grant
    countries: [HR, BiH, ME]
    programme: "Interreg IPA CBC HR-BA-ME"
    verified: false
    note: "Domain responds; homepage lists news, not calls. Needs a calls-page URL."

  - id: interreg-danube
    name: "Interreg Danube Region"
    url: "https://interreg-danube.eu/calls-for-proposals"
    link_selector: "h2 a, h3 a, .entry-title a, .views-row a, .card a"
    category: Interreg
    call_type: grant
    countries: [BiH]
    programme: "Interreg Danube"
    verified: false
    note: "URL correct and returns 200, but the call list is JavaScript-rendered."
