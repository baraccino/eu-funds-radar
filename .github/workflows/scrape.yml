name: Weekly funding scan

on:
  schedule:
    - cron: "0 6 * * 1"        # Mondays 06:00 UTC
  workflow_dispatch:            # and whenever you click Run workflow
  push:
    paths:
      - "config/**"             # re-rank immediately when you retune
      - "radar/**"

permissions:
  contents: write

concurrency:
  group: funding-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium for JavaScript-rendered sources
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Scrape, enrich and rank
        run: python run.py

      - name: Report source health
        if: always()
        run: python verify_sources.py || true   # informational, never fails the run

      - name: Commit refreshed data
        run: |
          git config user.name  "funding-radar"
          git config user.email "actions@github.com"
          if git diff --quiet docs/data/calls.json; then
            echo "No change in call data."
          else
            n=$(python -c "import json;d=json.load(open('docs/data/calls.json'));print(d['counts']['total'])")
            git add docs/data/calls.json
            git commit -m "Weekly scan $(date -u +%Y-%m-%d): ${n} calls"
            git push
          fi

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull the data the scan just committed
        run: git pull --ff-only origin main || true

      # Publishes to the gh-pages branch rather than the Pages deployment API,
      # so the site works with Pages set to "Deploy from a branch: gh-pages".
      # That is a single repository setting instead of three.
      - name: Publish site to gh-pages
        run: |
          git config user.name  "funding-radar"
          git config user.email "actions@github.com"
          rm -rf /tmp/site && mkdir -p /tmp/site
          cp -r docs/. /tmp/site/
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -q
          git add -A
          git commit -q -m "Publish site $(date -u +%Y-%m-%d)"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:gh-pages
